services:
  # 1. Express API Web Service
  - type: web
    name: upbro-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: upbro-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  # 2. Standalone Worker Background Process
  - type: worker
    name: upbro-worker
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start:worker
    envVars:
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: upbro-redis
          property: connectionString
      - key: WORKER_CONCURRENCY
        value: "10"
      - key: JWT_SECRET
        fromService:
          type: web
          name: upbro-api
          property: JWT_SECRET
      - key: NODE_ENV
        value: production

  # 3. Static Site React Frontend
  - type: web
    name: upbro-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: upbro-api
          property: url

  # 4. Managed Redis Instance
  - type: redis
    name: upbro-redis
    ipAllowList: []
    plan: free
